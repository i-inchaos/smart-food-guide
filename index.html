function drawOne(index){const pools=modePools[currentMode];const prior=mealState[index];const used=new Set();mealState.forEach((m,i)=>{if(i===index||!m)return;for(const x of m.foods)used.add(x);if(m.staple)used.add(m.staple)});if(index===0){const keep=prior&&locked[0].has('0');const food=keep?prior.foods[0]:randomPick(pools.breakfast,used);mealState[0]={foods:[food]};return}

function dayScore(day){const rec=journal[day];if(!rec)return 0;const meals=mealNames.flatMap(m=>entriesFor(day,m));if(!meals.length)return 0;let good=0,adjust=0,less=0;for(const f of meals){const l=levelFor(f);if(l==='优先选择')good++;else if(l==='调整后选择')adjust++;else if(l==='减少频率')less++}const known=good+adjust+less;const ratio=known? (good+.55*adjust)/known:0;const mealCount=mealNames.slice(0,3).filter(m=>entriesFor(day,m).length).length;const score=ratio*.8+(mealCount/3)*.2-(less/Math.max(1,known))*.2;return Math.max(1,Math.min(3,Math.ceil(score*3)))}
function renderHeatmap(){const target=document.getElementById('heatmap');target.replaceChildren();const chosen=new Date(dateField.value+'T12:00:00');if(Number.isNaN(+chosen))return;const year=chosen.getFullYear(),month=chosen.getMonth(),days=new Date(year,month+1,0).getDate();document.getElementById('heatMonth').textContent=year+'年'+(month+1)+'月';for(const name of ['一','二','三','四','五','六','日']){const l=document.createElement('span');l.className='weekday';l.textContent=name;target.append(l)}const offset=(new Date(year,month,1).getDay()+6)%7;for(let i=0;i<offset;i++){const blank=document.createElement('span');target.append(blank)}for(let d=1;d<=days;d++){const key=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const b=document.createElement('button');b.className='heat-cell heat-'+dayScore(key)+(key===dateField.value?' selected':'');b.textContent=d;b.title=key+' · '+(dayScore(key)?'已记录':'未记录');b.onclick=()=>{dateField.value=key;renderJournal()};target.append(b)}}

document.getElementById('addCustom').onclick=()=>{const food=prompt('🍽️ 新菜名（例如：番茄肉羹）');if(!food||!food.trim())return;const name=food.trim();if(all.some(x=>x.food===name)||customFoods.some(x=>x.food===name))return alert('这道菜已经在菜单里了');const level=prompt('推荐等级：输入 1（优先选）、2（调整后选）、3（偶尔吃）','2');if(level===null)return;const map={'1':'优先选择','2':'调整后选择','3':'减少频率'};if(!map[level.trim()])return alert('请输入 1、2 或 3');const item={id:'自定义|'+name,food:name,group:'✨ 我的新增菜品',level:map[level.trim()]};customFoods.push(item);all.unshift(item);persistCustom();cat='';query='';document.getElementById('q').value='';renderCats();render();alert('✓ 已加入菜品库，可以在发现菜品中搜索并加入点菜单')};

document.getElementById('importData').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.journal||typeof data.journal!=='object'||!Array.isArray(data.customFoods))throw Error('格式不正确');if(!confirm('恢复备份将覆盖当前食历和自定义菜品，确定继续吗？'))return;journal=data.journal;customFoods=data.customFoods;persistJournal();persistCustom();location.reload()}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
document.getElementById('exportPdf').onclick=()=>{const from=document.getElementById('exportStart').value,to=document.getElementById('exportEnd').value;if(!from||!to||from>to)return alert('请选择正确的起止日期');const days=Object.keys(journal).filter(d=>d>=from&&d<=to&&mealNames.some(m=>entriesFor(d,m).length)).sort();if(!days.length)return alert('这个时间范围还没有饮食记录');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const counts=new Map();let meals=0;for(const d of days)for(const m of mealNames){const foods=entriesFor(d,m);if(foods.length)meals++;for(const f of new Set(foods))counts.set(f,(counts.get(f)||0)+1)}const top=[...counts].sort((a,b)=>b[1]-a[1]).slice(0,10);const dist=[0,0,0,0];for(const d of days)dist[dayScore(d)]++;const sections=days.map(d=>'<section class="day"><h2>📅 '+esc(d)+'</h2>'+mealNames.map(m=>'<div class="meal"><b>'+({早餐:'🌤',午餐:'☀️',晚餐:'🌙',加餐:'🍎'})[m]+' '+m+'</b><span>'+esc(entriesFor(d,m).join(' · ')||'未记录')+'</span></div>').join('')+'</section>').join('');const tops=top.map(([f,n],i)=>'<span class="topitem">'+(i+1)+'. '+esc(f)+' <b>'+n+'次</b></span>').join('');const doc='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>好好吃饭-长期食历-'+esc(from)+'-'+esc(to)+'</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#27382f;margin:0;line-height:1.6;background:#fff}header{padding:20px 0;border-bottom:3px solid #dce8d7}h1{font-size:29px;margin:4px 0;color:#c65b42;font-family:Georgia,serif}.kicker{font-size:10px;letter-spacing:2px;color:#b66a4d}.sub{font-size:12px;color:#758274}.summary{display:flex;gap:10px;margin:16px 0}.stat{flex:1;padding:12px;background:#f3f5eb;border-radius:10px}.stat b{font-size:22px;display:block}.stat span{font-size:10px;color:#758274}.tops{display:flex;flex-wrap:wrap;gap:6px}.topitem{padding:6px 10px;background:#f9ede3;border-radius:8px;font-size:11px}.topitem b{color:#b65d43}.day{break-inside:avoid;page-break-inside:avoid;border:1px solid #e9e6dd;border-radius:10px;margin:12px 0;padding:10px 13px}h2{font-size:14px;margin:0 0 8px}.meal{display:flex;gap:12px;border-top:1px solid #f0ede6;padding:6px 0;font-size:11px}.meal b{width:56px;flex:none}.meal span{flex:1}.note{font-size:10px;color:#858c80;margin:16px 0}@page{size:A4;margin:16mm}@media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><header><div class="kicker">EAT WELL · FEEL GOOD</div><h1>好好吃饭 · 长期食历</h1><div class="sub">'+esc(from)+' — '+esc(to)+'</div></header><div class="summary"><div class="stat"><b>'+days.length+'</b><span>记录天数</span></div><div class="stat"><b>'+meals+'</b><span>已记录餐次</span></div><div class="stat"><b>'+counts.size+'</b><span>不同菜品</span></div></div><h2>🏆 常吃菜品 TOP 10</h2><div class="tops">'+tops+'</div><h2 style="margin-top:18px">🌱 饮食搭配概览</h2><p class="sub">较均衡 '+dist[3]+' 天 · 中等 '+dist[2]+' 天 · 可调整 '+dist[1]+' 天。仅根据菜品推荐等级及记录完整度粗略计算，不代表血糖或医学健康评分。</p><h2 style="margin-top:20px">📖 每日餐食明细</h2>'+sections+'<p class="note">由「好好吃饭」生成 · 个人饮食手账，仅供自我回顾</p></body></html>';const win=window.open('','_blank');if(!win)return alert('请允许弹出窗口以导出 PDF');win.document.open();win.document.write(doc);win.document.close();win.focus();setTimeout(()=>win.print(),450)};
